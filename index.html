<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paluwagan Palengke Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .paid { background-color: #dcfce7; border-color: #22c55e; }
        .unpaid { background-color: #fef2f2; border-color: #ef4444; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6">
        <h1 class="text-2xl font-bold text-center text-slate-800 mb-2">Paluwagan Tracker</h1>
        <p class="text-center text-slate-500 text-sm mb-6">Real-time Updates</p>

        <div id="loading" class="text-center py-10 text-slate-400 italic">Kumokonekta sa Firebase...</div>
        
        <div id="listahan" class="space-y-3 hidden">
            </div>

        <div class="mt-8 pt-4 border-t border-slate-100">
            <button onclick="pindotAdmin()" class="w-full py-3 bg-slate-800 text-white rounded-xl font-medium hover:bg-slate-700 transition">
                🔒 ADMIN LOGIN (UPDATE)
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // CONFIG MO MULA SA SCREENSHOT
        const firebaseConfig = {
            apiKey: "AIzaSyBbmXujvlOIUxIYi2saaQg85NUfeuM69ic",
            authDomain: "paluwagan-palengke.firebaseapp.com",
            databaseURL: "https://paluwagan-palengke-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "paluwagan-palengke",
            storageBucket: "paluwagan-palengke.firebasestorage.app",
            messagingSenderId: "248955510909",
            appId: "1:248955510909:web:7ad1b6ec652e43312ed114",
            measurementId: "G-6X17KNVDZ3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const membersRef = ref(db, 'members');

        let modeAdmin = false;
        let localData = [];

        // LOAD DATA
        onValue(membersRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                // Kung wala pang laman, gawa tayo ng 23 members
                let initial = [];
                for(let i=1; i<=23; i++) {
                    initial.push({ id: i, pangalan: "Member " + i, status: "UNPAID" });
                }
                set(membersRef, initial);
                return;
            }

            localData = data;
            renderList();
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('listahan').classList.remove('hidden');
        });

        function renderList() {
            const container = document.getElementById('listahan');
            container.innerHTML = '';

            localData.forEach((m, index) => {
                const div = document.createElement('div');
                div.className = `flex justify-between items-center p-4 border-2 rounded-xl transition ${m.status === 'PAID' ? 'paid' : 'unpaid'}`;
                
                div.innerHTML = `
                    <div>
                        <span class="text-xs text-slate-400 font-bold">#${m.id}</span>
                        <div class="font-bold text-slate-700">${m.pangalan}</div>
                    </div>
                    ${modeAdmin ? 
                        `<button onclick="toggleStatus(${index})" class="bg-white px-4 py-1 rounded-lg shadow-sm text-xs font-bold border">PALITAN</button>` : 
                        `<span class="text-xs font-black ${m.status === 'PAID' ? 'text-green-600' : 'text-red-500'}">${m.status}</span>`
                    }
                `;
                container.appendChild(div);
            });
        }

        window.pindotAdmin = () => {
            const pin = prompt("Ilagay ang Admin PIN (Default: 1234):");
            if(pin === "1234") {
                modeAdmin = !modeAdmin;
                renderList();
                alert(modeAdmin ? "Update Mode: ON" : "Update Mode: OFF (View Only)");
            } else {
                alert("Maling PIN!");
            }
        };

        window.toggleStatus = (idx) => {
            localData[idx].status = localData[idx].status === "PAID" ? "UNPAID" : "PAID";
            set(membersRef, localData);
        };
    </script>
</body>
</html>
