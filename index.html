<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paluwagan 🏆 Real-time</title>
    <style>
        :root {
            --primary: #27ae60; /* Green */
            --dark: #2c3e50;
            --border: #dee2e6;
            --light-green: #2ecc71;
        }

        body { font-family: sans-serif; margin: 0; background: #f4f7f6; overflow: hidden; }
        .header { background: var(--dark); color: white; padding: 10px; text-align: center; height: 50px; }
        .wrapper { width: 100vw; height: calc(100vh - 70px); overflow: auto; position: relative; }
        table { border-collapse: separate; border-spacing: 0; table-layout: fixed; }

        thead th {
            position: sticky; top: 0; z-index: 10;
            background: var(--dark); color: white; font-size: 11px;
            padding: 10px 5px; border: 0.5px solid #444; width: 75px;
        }

        td:first-child, th:first-child {
            position: sticky; left: 0; z-index: 20;
            background: var(--primary); 
            color: white; 
            width: 130px; min-width: 130px;
            font-weight: bold; font-size: 12px; border-right: 2px solid #219150;
            text-align: left; padding: 0 5px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        
        thead th:first-child { z-index: 30; background: #1e8449; }

        .editable-name { padding: 10px 5px; outline: none; border-radius: 4px; display: inline-block; width: 85%; }
        .update-mode .editable-name { border: 1px dashed #fff; background: rgba(255,255,255,0.2); cursor: text; }

        td { border: 0.5px solid var(--border); padding: 0; height: 55px; background: white; text-align: center; }

        .cell-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .pay-btn {
            width: 100%; height: 100%; border: none; background: transparent;
            font-size: 9px; font-weight: bold; cursor: pointer; color: transparent;
            -webkit-tap-highlight-color: transparent;
        }
        .pay-btn.paid { background: var(--light-green) !important; color: white !important; }
        .update-mode .pay-btn:not(.paid) { color: #ccc; }

        .trophy {
            position: absolute; font-size: 18px; pointer-events: none; z-index: 5;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        .btn-action {
            position: fixed; bottom: 20px; right: 20px;
            padding: 12px 20px; border-radius: 30px;
            background: var(--dark); color: white; border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 1000;
            font-weight: bold; font-size: 14px; cursor: pointer;
        }
        .btn-action.active { background: var(--primary); }
    </style>
</head>
<body>

<div class="header">
    <b style="font-size: 14px;">🏆 Paluwagan Tracker 🏆</b><br>
    <small id="mode-text">View Mode (Locked)</small>
</div>

<div class="wrapper">
    <table id="mainTable">
        <thead><tr id="dateHeader"><th>MEMBERS</th></tr></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<button class="btn-action" id="actionBtn">🔒 LOCK</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBbmXujvlOIUxIYi2saaQg85NUfeuM69ic",
        authDomain: "paluwagan-palengke.firebaseapp.com",
        databaseURL: "https://paluwagan-palengke-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "paluwagan-palengke",
        storageBucket: "paluwagan-palengke.firebasestorage.app",
        messagingSenderId: "248955510909",
        appId: "1:248955510909:web:7ad1b6ec652e43312ed114"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const rootRef = ref(db, 'paluwagan_data');

    let isUpdateMode = false;
    let remoteData = { db: {}, names: {} };

    const dates = [];
    let d = new Date('2026-03-23');
    const end = new Date('2026-08-29');
    while(d <= end) {
        dates.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
        d.setDate(d.getDate() + 1);
    }

    const trophyStartIndex = dates.indexOf("Mar 29");
    const lastDayIndex = dates.indexOf("Aug 29");

    // Listen to Firebase Changes
    onValue(rootRef, (snapshot) => {
        const val = snapshot.val();
        if (val) {
            remoteData = val;
            buildGrid();
        } else {
            // Initial Push if DB is empty
            set(rootRef, { db: {}, names: {} });
        }
    });

    function buildGrid() {
        const header = document.getElementById('dateHeader');
        const body = document.getElementById('tableBody');
        const btn = document.getElementById('actionBtn');
        
        // Reset table but keep first column header
        header.innerHTML = '<th>MEMBERS</th>';
        body.innerHTML = '';

        if(isUpdateMode) {
            document.body.classList.add('update-mode');
            document.getElementById('mode-text').innerText = "Update Mode (On)";
            btn.innerText = "📝 UPDATE";
            btn.classList.add('active');
        } else {
            document.body.classList.remove('update-mode');
            document.getElementById('mode-text').innerText = "View Mode (Locked)";
            btn.innerText = "🔒 LOCK";
            btn.classList.remove('active');
        }

        dates.forEach(dateLabel => {
            const th = document.createElement('th');
            th.innerText = dateLabel;
            header.appendChild(th);
        });

        for(let i=0; i<23; i++) {
            const tr = document.createElement('tr');
            const nameTd = document.createElement('td');
            const nameId = `member_${i}`;
            const currentName = remoteData.names?.[nameId] || (i === 0 ? "ADMIN" : `MEMBER ${i}`);

            nameTd.innerHTML = `
                <div class="editable-name" 
                     contenteditable="${isUpdateMode}" 
                     data-id="${nameId}">
                    ${currentName}
                </div>
            `;
            
            // Save name on blur
            nameTd.querySelector('.editable-name').onblur = (e) => {
                if(isUpdateMode) {
                    const newName = e.target.innerText.trim();
                    update(ref(db, 'paluwagan_data/names'), { [nameId]: newName });
                }
            };

            tr.appendChild(nameTd);

            dates.forEach((dateLabel, dIdx) => {
                const td = document.createElement('td');
                const key = `${nameId}-${dateLabel}`.replace(/[.#$/[\]]/g, '_'); // Firebase key safety
                const isPaid = remoteData.db?.[key] === true;
                
                const isSahodDay = (dIdx === (trophyStartIndex + (i * 7))) || (i === 22 && dIdx === lastDayIndex);

                const container = document.createElement('div');
                container.className = 'cell-container';

                const btnCell = document.createElement('button');
                btnCell.className = `pay-btn ${isPaid ? 'paid' : ''}`;
                btnCell.innerText = 'PAID';
                btnCell.onclick = () => { 
                    if(isUpdateMode) { 
                        update(ref(db, 'paluwagan_data/db'), { [key]: !isPaid });
                    } 
                };

                if(isSahodDay) {
                    const trophy = document.createElement('span');
                    trophy.className = 'trophy';
                    trophy.innerText = '🏆';
                    container.appendChild(trophy);
                }

                container.appendChild(btnCell);
                td.appendChild(container);
                tr.appendChild(td);
            });
            body.appendChild(tr);
        }
    }

    document.getElementById('actionBtn').onclick = () => {
        if(!isUpdateMode) {
            if(prompt("Enter Admin PIN:") === "1234") {
                isUpdateMode = true;
                buildGrid();
            } else { alert("Wrong PIN!"); }
        } else {
            isUpdateMode = false;
            buildGrid();
        }
    };
</script>
</body>
</html>
